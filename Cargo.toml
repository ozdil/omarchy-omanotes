[package]
name = "omanotes-engine"
version = "1.0.0"
edition = "2021"
authors = ["Ozan Özdil <ozan@pm.me>"]
description = "Zero-Knowledge E2EE & Cloud-Sync Note Manager Engine for Omarchy Linux"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
